# Supabase CLI yapılandırması (yerel geliştirme ve deploy). Gizli değerler burada TUTULMAZ.
project_id = "kapinda"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "https://kapinda.site"
additional_redirect_urls = ["https://www.kapinda.site", "https://kapinda.site/auth/callback", "https://www.kapinda.site/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

# Kullanıcı JWT'si gerektiren fonksiyonlar fonksiyon içinde doğrular; aşağıdakiler harici çağrı alır.
[functions.calculate-delivery-fee]
verify_jwt = true

[functions.iyzico-checkout]
verify_jwt = true

[functions.issue-delivery-qr]
verify_jwt = true

[functions.verify-delivery-qr]
verify_jwt = true

# iyzico tarayıcı yönlendirmesi ve webhook: imza/sunucu-sunucu doğrulama fonksiyon içinde
[functions.iyzico-callback]
verify_jwt = false

[functions.iyzico-webhook]
verify_jwt = false

[functions.handle-email-unsubscribe]
verify_jwt = false

[functions.newsletter-subscribe]
verify_jwt = false

# Zamanlanmış (x-cron-secret) veya admin JWT ile çağrılır; fonksiyon içinde doğrulanır
[functions.dispatch-notifications]
verify_jwt = false

[functions.send-emails]
verify_jwt = false

[functions.process-refunds]
verify_jwt = false

[functions.system-health]
verify_jwt = false

[functions.seo-check]
verify_jwt = false
