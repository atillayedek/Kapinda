name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (contracts, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ortak contract dosyaları güncel mi
        run: pnpm contracts:check
      - name: Gizli değer taraması
        run: pnpm secrets:scan
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production build (prerender + sitemap)
        run: pnpm --filter @kapinda/customer-web build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: https://kapinda.site
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: customer-web-dist
          path: apps/customer-web/dist
          retention-days: 7

  supabase:
    name: Supabase (migrations + SQL invariant/RLS/QR testleri, Edge Functions)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL istemcisi
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migration doğrulama ve testler (geçici veritabanı; production'a bağlanmaz)
        run: bash scripts/db-test.sh
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions lint / fmt / typecheck / test
        working-directory: supabase/functions
        run: |
          deno lint
          deno fmt --check
          deno check */index.ts
          deno test tests/

  android:
    name: Android (lint, test, assemble)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/courier-android
    env:
      KAPINDA_SUPABASE_URL: ${{ secrets.KAPINDA_SUPABASE_URL }}
      KAPINDA_SUPABASE_ANON_KEY: ${{ secrets.KAPINDA_SUPABASE_ANON_KEY }}
      KAPINDA_MAPS_ANDROID_KEY: ${{ secrets.KAPINDA_MAPS_ANDROID_KEY }}
      KAPINDA_FIREBASE_API_KEY: ${{ secrets.KAPINDA_FIREBASE_API_KEY }}
      KAPINDA_FIREBASE_ANDROID_APP_ID: ${{ secrets.KAPINDA_FIREBASE_ANDROID_APP_ID }}
      KAPINDA_FIREBASE_PROJECT_ID: ${{ secrets.KAPINDA_FIREBASE_PROJECT_ID }}
      KAPINDA_FIREBASE_SENDER_ID: ${{ secrets.KAPINDA_FIREBASE_SENDER_ID }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Release imzalama anahtarı (varsa)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          KAPINDA_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          KAPINDA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KAPINDA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KAPINDA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: courier-android
          path: |
            apps/courier-android/app/build/outputs/apk/release/*.apk
            apps/courier-android/app/build/outputs/bundle/release/*.aab
          retention-days: 7

  windows:
    name: Windows (dotnet restore, build, test, publish EXE)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/vendor-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Kapinda.Vendor.sln
      - run: dotnet build Kapinda.Vendor.sln -c Release --no-restore
      - run: dotnet test tests/Kapinda.Vendor.Core.Tests -c Release --no-build
      - name: Release EXE (self-contained, tek dosya)
        run: dotnet publish src/Kapinda.Vendor.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-windows-exe
          path: apps/vendor-windows/publish/win-x64
          retention-days: 7
