<!doctype html>
<html lang="tr">
<head>

<meta name="robots" content="noindex, nofollow" />
<title>Bağlantı yok — Kapında</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6f4ef; color: #1f2a24; display: grid; place-items: center; min-height: 100vh; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  h1 { color: #0f6b4f; font-size: 22px; }
  button { background: #0f6b4f; color: #fff; border: 0; border-radius: 10px; padding: 12px 18px; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>İnternet bağlantısı yok</h1>
  <p>Sipariş vermek ve siparişlerinizi takip etmek için internet bağlantısı gereklidir. Çevrimdışıyken sipariş oluşturulmaz ve kuyruğa alınmaz.</p>
  <button onclick="location.reload()">Tekrar dene</button>
</main>
</body>
</html>
